<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="azulPN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="verdeGC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <clipPath id="escudo">
      <path d="M150 30 L250 60 L250 150 Q250 225 150 270 Q50 225 50 150 L50 60 Z"/>
    </clipPath>
  </defs>

  <!-- ESCUDO -->
  <g clip-path="url(#escudo)">
    <!-- Mitad azul (PN) -->
    <rect x="30" y="10" width="240" height="280" fill="url(#azulPN)"/>
    <!-- Mitad verde (GC), corte diagonal -->
    <polygon points="270,10 270,290 30,290" fill="url(#verdeGC)"/>
    <!-- Línea de pulso (electrocardiograma) -->
    <polyline points="40,158 95,158 112,158 124,120 140,196 154,96 168,190 182,158 205,158 260,158"
              fill="none" stroke="#ffffff" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brillo sutil superior -->
    <path d="M150 30 L250 60 L250 92 Q150 68 50 92 L50 60 Z" fill="#ffffff" opacity="0.10"/>
  </g>
  <!-- Borde del escudo -->
  <path d="M150 30 L250 60 L250 150 Q250 225 150 270 Q50 225 50 150 L50 60 Z"
        fill="none" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>

  <!-- WORDMARK -->
  <text x="300" y="128" fill="#0f172a" font-size="34" font-weight="600" letter-spacing="6">ACADEMIA</text>
  <text x="296" y="196" fill="#0f172a" font-size="74" font-weight="800" letter-spacing="1">EN VIGOR</text>
  <line x1="302" y1="220" x2="700" y2="220" stroke="#16a34a" stroke-width="4"/>
  <line x1="302" y1="220" x2="500" y2="220" stroke="#1d4ed8" stroke-width="4"/>
  <text x="302" y="252" fill="#475569" font-size="21" font-style="italic">El temario que nunca descansa</text>
</svg>
