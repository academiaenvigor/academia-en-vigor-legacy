<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fondo blanco (ahorro de tinta / impresión B-N) -->
  <rect width="900" height="640" fill="#ffffff" rx="16" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Título -->
  <text x="450" y="48" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="700">LA PIRÁMIDE NORMATIVA ESPAÑOLA</text>
  <text x="450" y="74" text-anchor="middle" fill="#64748b" font-size="14">Art. 9.3 CE · Art. 1.2 CC — «Carecerán de validez las disposiciones que contradigan otra de rango superior»</text>

  <!-- Nivel 1: Constitución (azul claro PN, el más importante) -->
  <polygon points="450,105 560,195 340,195" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="165" text-anchor="middle" fill="#1e3a8a" font-size="17" font-weight="700">CONSTITUCIÓN</text>
  <text x="450" y="184" text-anchor="middle" fill="#475569" font-size="11">1978 · Norma suprema</text>

  <!-- Nivel 2: Tratados -->
  <polygon points="335,200 565,200 630,280 270,280" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="235" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">TRATADOS INTERNACIONALES</text>
  <text x="450" y="256" text-anchor="middle" fill="#64748b" font-size="11">Válidamente celebrados y publicados en el BOE (art. 96 CE)</text>

  <!-- Nivel 3: Leyes -->
  <polygon points="265,285 635,285 700,395 200,395" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="320" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">NORMAS CON RANGO DE LEY</text>
  <text x="450" y="345" text-anchor="middle" fill="#475569" font-size="12">Leyes orgánicas · Leyes ordinarias</text>
  <text x="450" y="365" text-anchor="middle" fill="#475569" font-size="12">Real Decreto-ley (art. 86) · Real Decreto Legislativo (arts. 82-85)</text>
  <!-- Nota importante en verde GC -->
  <text x="450" y="386" text-anchor="middle" fill="#166534" font-size="11" font-weight="700">⚠️ Orgánica y ordinaria: COMPETENCIA, no jerarquía</text>

  <!-- Nivel 4: Reglamentos -->
  <polygon points="195,400 705,400 770,510 130,510" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="437" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">REGLAMENTOS</text>
  <text x="450" y="462" text-anchor="middle" fill="#475569" font-size="12">Real Decreto (Consejo de Ministros / Presidente)</text>
  <text x="450" y="482" text-anchor="middle" fill="#475569" font-size="12">Orden ministerial · Resoluciones e instrucciones</text>

  <!-- Flecha lateral -->
  <line x1="805" y1="140" x2="805" y2="490" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="805,120 797,140 813,140" fill="#94a3b8"/>
  <text x="828" y="300" fill="#64748b" font-size="12" transform="rotate(90 828 300)">+ JERARQUÍA · − RANGO ↓</text>

  <!-- Nota inferior: enunciado clave en verde GC claro -->
  <rect x="150" y="528" width="600" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="450" y="550" text-anchor="middle" fill="#14532d" font-size="13" font-weight="700">⭐ Lo que cae: irretroactividad de las sancionadoras no favorables (art. 9.3 CE)</text>
  <text x="450" y="570" text-anchor="middle" fill="#166534" font-size="12">Norma posterior deroga a la anterior (art. 2.2 CC) · Norma especial prevalece sobre la general</text>

  <!-- Marca -->
  <text x="450" y="614" text-anchor="middle" fill="#94a3b8" font-size="11">ACADEMIA EN VIGOR · Preparado por personal en activo</text>
</svg>
